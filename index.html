<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroEquip Map</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12h20M2 12l5-5m-5 5l5 5" />
                </svg>
                <h1>AeroEquip Map</h1>
            </div>
            <div class="user-profile">
                <button class="btn-primary" id="export-btn"
                    style="margin-right: 15px; padding: 8px 16px; font-size: 0.9rem;">
                    ⬇ Export XLSX
                </button>
                <div class="avatar">CK</div>
            </div>
        </header>

        <main class="main-content">
            <!-- Aircraft Fleet Management -->
            <section class="aircraft-selector">
                <div class="section-header">
                    <h2>Aircraft Fleet</h2>
                    <button class="btn-primary" id="add-aircraft-btn">+ Add Aircraft</button>
                </div>
                <div class="aircraft-grid" id="aircraft-container">
                    <!-- Dynamic aircraft folders will be injected here -->
                </div>
            </section>

            <!-- Sub-Zone / Location Map -->
            <section class="location-map hidden" id="location-map-section">
                <div class="map-header">
                    <h2 id="current-zone-title">Locations</h2>
                </div>
                <div class="locations-grid" id="locations-container">
                    <!-- Dynamic content will be injected here -->
                </div>
            </section>

            <!-- Equipment List for Selected Location -->
            <section class="equipment-section hidden" id="equipment-section">
                <div class="section-header">
                    <h2 id="selected-location-title">Location Equipment</h2>
                    <button class="btn-primary" id="add-equip-btn">+ Add Equipment</button>
                </div>

                <div class="equipment-list" id="equipment-list">
                    <!-- Equipment items will be listed here -->
                    <div class="empty-state">
                        <p>No equipment mapped yet.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Add/Edit Equipment Modal -->
        <div class="modal-overlay" id="item-modal">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modal-title">Add Equipment</h2>
                    <button class="close-btn" id="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="equipment-form">
                        <!-- Specific Location Input -->
                        <div class="form-group">
                            <label for="specific-location">Specific Location</label>
                            <input type="text" id="specific-location" name="specific-location"
                                placeholder="OHSB 23DEF, LH4 DOOR C/ATT. SEAT etc.">
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" name="description" required placeholder="e.g. Life Vest"
                                list="equipment-suggestions">
                            <datalist id="equipment-suggestions">
                                <option value="LIFE VEST PASSENGER">
                                <option value="LIFE VEST CREW">
                                <option value="LIFE VEST SPARE">
                                <option value="LIFE VEST INFANT">
                                <option value="SEAT BELT EXTENSION">
                                <option value="SEAT BELT INFANT">
                                <option value="OXYGEN CYLINDER">
                                <option value="OXYGEN SPARE MASK">
                                <option value="SMOKE HOOD (PBE)">
                                <option value="MEGAPHONE">
                                <option value="SEAT BELT SPARE">
                                <option value="FLASHLIGHT">
                                <option value="PORTABLE FIRE EXTINGUISHER">
                                <option value="FIREPROOF GLOVES">
                                <option value="ELT">
                                <option value="SURVIVAL KIT">
                                <option value="EMERGENCY MEDICAL KIT">
                                <option value="CRASH AXE">
                                <option value="FIRST AID KIT">
                            </datalist>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="part-number">Part Number</label>
                                <div class="input-group">
                                    <input type="text" id="part-number" name="part-number" placeholder="PN-12345"
                                        list="part-number-suggestions">
                                    <button type="button" class="btn-secondary btn-na"
                                        data-target="part-number">N/A</button>
                                </div>
                                <datalist id="part-number-suggestions">
                                    <option value="P01074-201WC">
                                    <option value="680-0040-000">
                                    <option value="6901500000">
                                    <option value="E28180-20-0006">
                                    <option value="P3APP003010D">
                                    <option value="2226-2-011-8049">
                                    <option value="P2-07-0001-214">
                                    <option value="995000">
                                    <option value="FKK8-35KL">
                                    <option value="MF20-534">
                                    <option value="PVG EMK">
                                    <option value="PVG FAK 10">
                                    <option value="502748-401-2256">
                                    <option value="2226-1-031-8049">
                                    <option value="P01074-101WC">
                                    <option value="01N65920">
                                    <option value="9700-C1A-BF23A">
                                    <option value="289-601-248">
                                    <option value="R0372A305">
                                    <option value="PVG FAK">
                                    <option value="289-601-212">
                                    <option value="P0640-101">
                                    <option value="2226-5-011-8049">
                                    <option value="60128-303">
                                    <option value="04N64255">
                                </datalist>
                            </div>
                            <div class="form-group">
                                <label for="serial-number">Serial Number</label>
                                <div class="input-group">
                                    <input type="text" id="serial-number" name="serial-number" placeholder="SN-98765"
                                        list="serial-number-suggestions">
                                    <button type="button" class="btn-secondary btn-na"
                                        data-target="serial-number">N/A</button>
                                </div>
                                <datalist id="serial-number-suggestions">
                                    <option value="7774">
                                    <option value="123053">
                                    <option value="123179">
                                    <option value="322054">
                                    <option value="13438671">
                                    <option value="1710290008">
                                    <option value="6928600300">
                                    <option value="17080230078">
                                    <option value="18010760020">
                                    <option value="20121110018">
                                    <option value="20121120017">
                                    <option value="22011670033">
                                    <option value="23030770029">
                                    <option value="24052370086">
                                    <option value="24102110036">
                                    <option value="25021810014">
                                    <option value="16350W/48583">
                                    <option value="18406W/6534F0">
                                    <option value="61156Y">
                                    <option value="A5CF3C093">
                                    <option value="A5D0E8059">
                                    <option value="A5D23031">
                                    <option value="B103422">
                                    <option value="B91523">
                                    <option value="C11415">
                                    <option value="C20698">
                                    <option value="P06121190">
                                    <option value="P13062146">
                                    <option value="P19192143">
                                    <option value="SE09853">
                                    <option value="ST51847">
                                    <option value="TAI25078">
                                    <option value="TAM25057">
                                </datalist>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="man-date">Manufacture Date</label>
                                <div class="input-group">
                                    <input type="text" id="man-date" name="man-date" placeholder="YYYY-MM-DD">
                                    <button type="button" class="btn-secondary btn-na"
                                        data-target="man-date">N/A</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="exp-date">Expire Date</label>
                                <div class="input-group">
                                    <input type="text" id="exp-date" name="exp-date" placeholder="YYYY-MM-DD">
                                    <button type="button" class="btn-secondary btn-na"
                                        data-target="exp-date">N/A</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="quantity">Quantity</label>
                                <input type="number" id="quantity" name="quantity" min="1" value="1">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="notes">Notes</label>
                            <textarea id="notes" name="notes" rows="3" placeholder="Additional details..."></textarea>
                        </div>

                        <div class="quick-notes">
                            <label>Quick status:</label>
                            <div class="note-buttons">
                                <button type="button" class="tag-btn damaged" data-note="DAMAGED">DAMAGED</button>
                                <button type="button" class="tag-btn missing" data-note="MISSING">MISSING</button>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
                            <button type="submit" class="btn-primary">Save Equipment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Add Aircraft Modal -->
        <div class="modal-overlay" id="aircraft-modal">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="aircraft-modal-title">Add New Aircraft</h2>
                    <button class="close-btn" id="close-aircraft-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="aircraft-form">
                        <div class="form-group">
                            <label for="aircraft-name">Aircraft Name</label>
                            <input type="text" id="aircraft-name" name="aircraft-name" required
                                placeholder="e.g. TC-JBA">
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-secondary" id="cancel-aircraft-btn">Cancel</button>
                            <button type="submit" class="btn-primary">Save Aircraft</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
